# Local dev/demo stack with a real Postgres, matching the production
# database target (spec 2.1: "Postgres for production deploy").
# Usage: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mindpulse
      POSTGRES_PASSWORD: mindpulse
      POSTGRES_DB: mindpulse
    ports:
      - "5432:5432"
    volumes:
      - mindpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://mindpulse:mindpulse@db:5432/mindpulse
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?set VAPID_PRIVATE_KEY in your .env}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?set VAPID_PUBLIC_KEY in your .env}
      VAPID_CLAIMS_EMAIL: ${VAPID_CLAIMS_EMAIL:-mailto:you@example.com}
      ALLOWED_ORIGINS: http://localhost:8000
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  mindpulse_pgdata:
