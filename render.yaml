# Render.com Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect this repo in the Render dashboard, "New +" -> "Blueprint".
services:
  - type: web
    name: mindpulse
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mindpulse-db
          property: connectionString
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_CLAIMS_EMAIL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.4

databases:
  - name: mindpulse-db
    plan: free
    postgresMajorVersion: 16
